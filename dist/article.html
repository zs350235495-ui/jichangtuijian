  <meta name="robots" content="noindex, follow">
  <script>
    (function() {
      // 兼容历史 /article 及 /article.html 路由
      var validSlugs = {
        'rule-based-routing-anti-pollution-guide': './post-rule-based-routing-anti-pollution-guide.html',
        'airport-selection-guide': './post-airport-selection-guide.html',
        'clash-verge-rev-tutorial': './post-clash-verge-rev-tutorial.html',

        'network-latency-packet-loss-troubleshooting': './post-network-latency-packet-loss-troubleshooting.html'
      };

      try {
        var params = new URLSearchParams(window.location.search);
        var rawPost = params.get('post') || params.get('id') || params.get('name') || '';
        var cleanSlug = rawPost.toLowerCase().replace(/^post-/, '').replace(/\.html$/, '').trim();

        if (cleanSlug && validSlugs[cleanSlug]) {
          // 使用 replace 静默替换历史记录，防止同级路径死循环刷新
          window.location.replace(validSlugs[cleanSlug]);
          return;
        }
      } catch (e) {
        // 静默容错
      }

      // 默认退回博客列表页，单次替换，禁止循环跳转
      window.location.replace('./blog.html');
    })();
  </script>
